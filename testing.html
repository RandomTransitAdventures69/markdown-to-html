
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown to HTML Converter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --panel-2: #171717;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #ffffff;
      --accent-soft: #d4d4d4;
      --button: #1f1f1f;
      --button-hover: #2d2d2d;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      --radius: 16px;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.06), transparent 30%),
        linear-gradient(135deg, #050505, #0b0b0b 40%, #111111 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .hero {
      margin-bottom: 28px;
      padding: 28px 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      max-width: 760px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin: 22px 0 30px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    button:hover {
      background: var(--button-hover);
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }

    button.primary {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    button.primary:hover {
      background: #e7e7e7;
      color: #000;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.012));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-header span {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-soft);
      letter-spacing: 0.01em;
    }

    .badge {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
    }

    textarea {
      width: 100%;
      min-height: 480px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font: 14px/1.7 "SFMono-Regular", Consolas, Monaco, monospace;
      outline: none;
      background: #0d0d0d;
      color: #ededed;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: #5a5a5a;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }

    .output {
      min-height: 480px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      background: #0d0d0d;
      overflow: auto;
      line-height: 1.7;
      color: #ededed;
    }

    .output h1,
    .output h2,
    .output h3 {
      letter-spacing: -0.02em;
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      color: #ffffff;
    }

    .output h1 {
      font-size: 2rem;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 10px;
    }

    .output h2 {
      font-size: 1.5rem;
    }

    .output h3 {
      font-size: 1.15rem;
    }

    .output p {
      color: #d7d7d7;
    }

    .output a {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .output ul {
      padding-left: 22px;
    }

    .output li {
      margin-bottom: 8px;
      color: #dddddd;
    }

    .output blockquote {
      border-left: 3px solid #666;
      margin: 1.2em 0;
      padding: 10px 16px;
      color: #bbbbbb;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }

    .output pre {
      background: #050505;
      color: #f5f5f5;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid #222;
    }

    .output code {
      background: #1a1a1a;
      color: #f5f5f5;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: Consolas, monospace;
    }

    .output pre code {
      background: transparent;
      padding: 0;
    }

    .output table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 16px;
      overflow: hidden;
      border-radius: 10px;
    }

    .output th,
    .output td {
      border: 1px solid #2a2a2a;
      padding: 12px 14px;
      text-align: left;
    }

    .output th {
      background: #181818;
      color: #ffffff;
      font-weight: 600;
    }

    .output td {
      background: #101010;
      color: #d6d6d6;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.7rem;
      }

      .container {
        padding: 24px 16px;
      }

      textarea,
      .output {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="eyebrow">Markdown Toolkit</div>
      <h1>Markdown to HTML Converter</h1>
      <p class="description">
        Write Markdown on the left and preview polished HTML on the right with a dark, premium interface.
      </p>
    </div>

    <div class="actions">
      <button class="primary" onclick="convertMarkdown()">Convert</button>
      <button onclick="copyHTML()">Copy HTML</button>
      <button onclick="loadExample()">Load Example</button>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">
          <span>Markdown Input</span>
          <div class="badge">Editor</div>
        </div>
        <textarea id="markdownInput" placeholder="Type your markdown here..."></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>HTML Preview</span>
          <div class="badge">Live Output</div>
        </div>
        <div id="htmlOutput" class="output"></div>
      </div>
    </div>
  </div>

  <script>
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseInline(text) {
      text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/\*(.*?)\*/g, "<em>$1</em>");
      text = text.replace(/`(.*?)`/g, "<code>$1</code>");
      text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
      return text;
    }

    function convertMarkdown() {
      const markdown = document.getElementById("markdownInput").value;
      const lines = markdown.split("\n");
      let html = "";
      let inList = false;
      let inCodeBlock = false;
      let inTable = false;
      let tableRows = [];

      function closeList() {
        if (inList) {
          html += "</ul>";
          inList = false;
        }
      }

      function renderTable() {
        if (tableRows.length > 0) {
          html += "<table><thead><tr>";
          tableRows[0].forEach(cell => {
            html += `<th>${parseInline(cell.trim())}</th>`;
          });
          html += "</tr></thead>";

          if (tableRows.length > 1) {
            html += "<tbody>";
            for (let r = 1; r < tableRows.length; r++) {
              html += "<tr>";
              tableRows[r].forEach(cell => {
                html += `<td>${parseInline(cell.trim())}</td>`;
              });
              html += "</tr>";
            }
            html += "</tbody>";
          }

          html += "</table>";
        }
        tableRows = [];
        inTable = false;
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        if (line.startsWith("```")) {
          closeList();

          if (!inCodeBlock) {
            inCodeBlock = true;
            html += "<pre><code>";
          } else {
            inCodeBlock = false;
            html += "</code></pre>";
          }
          continue;
        }

        if (inCodeBlock) {
          html += escapeHTML(line) + "\n";
          continue;
        }

        if (line.includes("|")) {
          const nextLine = lines[i + 1] || "";
          const isHeaderSeparator = /^\s*\|?[\s\-:|]+\|?\s*$/.test(nextLine);

          if (isHeaderSeparator && !inTable) {
            closeList();
            inTable = true;
            tableRows.push(line.split("|").filter(cell => cell !== ""));
            i++;
            continue;
          } else if (inTable) {
            tableRows.push(line.split("|").filter(cell => cell !== ""));
            continue;
          }
        } else if (inTable) {
          renderTable();
        }

        if (/^###\s+/.test(line)) {
          closeList();
          html += `<h3>${parseInline(line.replace(/^###\s+/, ""))}</h3>`;
        } else if (/^##\s+/.test(line)) {
          closeList();
          html += `<h2>${parseInline(line.replace(/^##\s+/, ""))}</h2>`;
        } else if (/^#\s+/.test(line)) {
          closeList();
          html += `<h1>${parseInline(line.replace(/^#\s+/, ""))}</h1>`;
        } else if (/^>\s+/.test(line)) {
          closeList();
          html += `<blockquote>${parseInline(line.replace(/^>\s+/, ""))}</blockquote>`;
        } else if (/^-\s+/.test(line)) {
          if (!inList) {
            html += "<ul>";
            inList = true;
          }
          html += `<li>${parseInline(line.replace(/^-\s+/, ""))}</li>`;
        } else if (line.trim() === "") {
          closeList();
        } else {
          closeList();
          html += `<p>${parseInline(line)}</p>`;
        }
      }

      closeList();
      if (inTable) renderTable();
      if (inCodeBlock) html += "</code></pre>";

      document.getElementById("htmlOutput").innerHTML = html;
    }

    function copyHTML() {
      const html = document.getElementById("htmlOutput").innerHTML;
      navigator.clipboard.writeText(html).then(() => {
        alert("HTML copied to clipboard.");
      });
    }

    function loadExample() {
      document.getElementById("markdownInput").value = `# Sample Markdown

## Features

- Bold and italic
- Lists
- Code blocks
- Links
- Blockquotes
- Tables

**Bold text** and *italic text*.

[OpenAI](https://openai.com)

> This is a blockquote.

\`\`\`
const hello = "world";
console.log(hello);
\`\`\`

| Name | Age |
|------|-----|
| Alice | 24 |
| Bob | 29 |`;

      convertMarkdown();
    }

    document.getElementById("markdownInput").addEventListener("input", convertMarkdown);
    loadExample();
  </script>
</body>
</html>
